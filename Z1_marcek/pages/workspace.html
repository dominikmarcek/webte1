    <div id="top-bar">
      <header>
        <a id="monogram" href="../">DM</a>

          <li>Dominik Marček</li>
          <li>študent api & umelec</li>

      <nav>
        <button id="hamburger-btn" aria-label="Toggle navigation menu">☰</button>

    <main>
      <h1>PRACOVNÉ PROSTREDIE</h1>
      <section class="workspace-section">
        <figure class="workspace-image">
          <img src="../img/workspace.jpeg" alt="Moje pracovné prostredie" width="1280" height="960" loading="lazy">

          <div class="hotspot" style="--x: 15%; --y: 63%">
            <button class="hotspot__dot" type="button" aria-label="MIDI klávesa"></button>
            <div class="hotspot__panel">
              <h2>MIDI klávesa</h2>
              <p>Túto 61-klávesovú MIDI klávesu od M-Audio používam na hudobnú produkciu.</p>
            </div>
          </div>

          <div class="hotspot" style="--x: 43%; --y: 61%">
            <button class="hotspot__dot" type="button" aria-label="Laptop"></button>
            <div class="hotspot__panel">
              <h2>Laptop</h2>
              <p>Na svojom laptope robím všetko od školy po hudobnú produkciu.</p>
            </div>
          </div>

          <div class="hotspot" style="--x: 71%; --y: 33%">
            <button class="hotspot__dot" type="button" aria-label="Fľaša vody"></button>
            <div class="hotspot__panel">
              <h2>Voda</h2>
              <p>H2O.</p>
            </div>
          </div>

          <div class="hotspot" style="--x: 90%; --y: 42%">
            <button class="hotspot__dot" type="button" aria-label="Papier"></button>
            <div class="hotspot__panel">
              <h2>Papier</h2>
              <p>Papier používam každý deň na usporiadanie myšlienok pri nových informáciach a pod., následne ho hneď vyhodím.</p>
            </div>
          </div>

          <div class="hotspot" style="--x: 56%; --y: 38%">
            <button class="hotspot__dot" type="button" aria-label="Slúchadlá"></button>
            <div class="hotspot__panel">
              <h2>Slúchadlá</h2>
              <p>Štúdiové slúchadlá od AKG používam pri hudobnej produkcii.</p>
            </div>
          </div>
        </figure>
      </section>
    </main>

    <footer>
